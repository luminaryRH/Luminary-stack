# Luminary contracts. Dependencies (not committed; cloned by tag, as in CI):
#   git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
#   git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts  (TimelockController, deploy only)
[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.28"
evm_version = "cancun" # Robinhood Chain mainnet runs PUSH0, TSTORE/TLOAD and MCOPY (checked 2026-10-19)
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "out" }, { access = "read", path = "test/fixtures" }, { access = "read", path = "../circuits/target" }, { access = "read-write", path = "deployments" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}" # mainnet 4663; default public RPC: https://rpc.mainnet.chain.robinhood.com

[lint]
lint_on_build = false

[invariant]
runs = 256
depth = 500 # 128,000 calls per invariant
fail_on_revert = true
