# Luminary contracts. Dependencies (not committed, test-only): git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun" # Robinhood Chain testnet supports PUSH0, TSTORE and MCOPY
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "out" }, { access = "read", path = "test/fixtures" }, { access = "read", path = "../circuits/target" }, { access = "read-write", path = "deployments" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
lint_on_build = false

[invariant]
runs = 256
depth = 500 # 128,000 calls per invariant
fail_on_revert = true
