# Luminary contracts. Dependencies (not committed): git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun" # Robinhood Chain testnet supports PUSH0, TSTORE and MCOPY
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../circuits/target" }, { access = "read-write", path = "deployments" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
lint_on_build = false
