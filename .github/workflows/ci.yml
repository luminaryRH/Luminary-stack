# CI for every push and pull request: the app checks, the contracts, the circuits, static analysis and a secret scan.
# Every action is pinned to a full commit SHA; the token is read-only; nothing here deploys (Vercel deploys from main).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (bun run check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: dependency advisories (production)
        run: bun audit --prod --audit-level=critical || echo "::warning::bun audit reported advisories (build-time copies are triaged in SECURITY.md)"

  contracts:
    name: contracts (forge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - run: git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge build --sizes
      - run: forge test -vv # includes the stateful invariants: 256 runs x 500 calls each
        env:
          FORK_RPC_URL: https://rpc.testnet.chain.robinhood.com # Fork.t.sol: the live stock token
      - run: forge coverage --report summary --no-match-coverage "(test|script|mocks|verifiers)/"
        env:
          FOUNDRY_INVARIANT_RUNS: "16"
          FOUNDRY_INVARIANT_DEPTH: "100"

  circuits:
    name: circuits (nargo)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: 1.0.0-beta.22
      - run: nargo test --workspace

  slither:
    name: static analysis (slither)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      # Slither cannot parse the bb-generated Honk verifiers, and the core contracts do not import them, so this
      # throwaway checkout analyses the core without the verifiers and the code that wires them (script, tests).
      - name: slither (core contracts)
        working-directory: contracts
        run: |
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
          rm -rf src/verifiers script test
          # Triaged in SECURITY.md: _pay pays proof-bound recipients only (arbitrary-send-eth); every flagged
          # reentrancy is on a nonReentrant function or on reclaim/advanceTree/pin/abandon, which a callback cannot use.
          slither . --exclude-dependencies --filter-paths "mocks" --fail-high \
            --exclude arbitrary-send-eth,reentrancy-eth,reentrancy-no-eth,reentrancy-benign,reentrancy-events

  semgrep:
    name: static analysis (semgrep, server code)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.179.0
      - run: semgrep scan --config p/typescript --config p/secrets --severity ERROR --error src/server src/routes/api src/shielded scripts supabase

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - run: ./gitleaks git --redact --exit-code 1 .
